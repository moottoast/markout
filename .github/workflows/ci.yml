name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify changelog decision
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          added_entry=false
          no_entry=false

          if grep -Eiq '^- \[[xX]\] I added a user-visible entry' <<< "${PR_BODY}"; then
            added_entry=true
          fi

          no_entry_line="$(
            grep -Ei '^- \[[xX]\] No changelog entry is needed because:' \
              <<< "${PR_BODY}" |
              head -n 1 ||
              true
          )"
          if [[ -n "${no_entry_line}" ]]; then
            no_entry=true
          fi

          if [[ "${added_entry}" == "${no_entry}" ]]; then
            echo "Select exactly one changelog option in the pull request."
            exit 1
          fi

          if [[ "${added_entry}" == "true" ]] &&
            git diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- CHANGELOG.md; then
            echo "The pull request says it has a changelog entry, but CHANGELOG.md did not change."
            exit 1
          fi

          if [[ "${no_entry}" == "true" ]]; then
            reason="${no_entry_line#*because:}"
            reason="${reason%%<!--*}"
            if [[ -z "${reason//[[:space:]]/}" ]]; then
              echo "Explain why no changelog entry is needed on the checked option's line."
              exit 1
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
